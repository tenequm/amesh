name: Check
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  main-tree:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      checked: ${{ steps.tree.outputs.checked }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet HEAD^1 HEAD -- go.mod go.sum && bash .github/tested-tree.sh HEAD; then
            echo 'checked=true' >> "$GITHUB_OUTPUT"
          fi
  check:
    needs: main-tree
    if: ${{ !cancelled() && needs.main-tree.outputs.checked != 'true' }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v3
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: just fmt-check test
  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - name: Install Betterleaks
        run: |
          curl -fsSLo "$RUNNER_TEMP/betterleaks.tar.gz" https://github.com/betterleaks/betterleaks/releases/download/v1.10.1/betterleaks_1.10.1_linux_x64.tar.gz
          echo "c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e  $RUNNER_TEMP/betterleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/betterleaks.tar.gz" -C "$RUNNER_TEMP" betterleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # The commits this push or pull request adds. BETTERLEAKS_PRIVATE_TOML, when set, adds a private rule set.
      - name: Scan new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRIVATE_TOML: ${{ secrets.BETTERLEAKS_PRIVATE_TOML }}
        run: |
          if [[ -n "$PRIVATE_TOML" ]]; then
            printf '%s\n' "$PRIVATE_TOML" > "$RUNNER_TEMP/private.toml"
            export BETTERLEAKS_PRIVATE_CONFIG="$RUNNER_TEMP/private.toml"
          fi
          if [[ -z "${BASE//0/}" ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=origin/main; fi
          just leaks "$BASE..HEAD"
