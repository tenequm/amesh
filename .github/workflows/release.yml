name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v3
      - run: just test
      - name: Build and publish fleet archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          just release "$version"
          cd "dist/$version"
          sha256sum --check checksums.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ./*.tar.gz checksums.txt
