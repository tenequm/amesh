assert_lefthook_installed: true
min_version: 2.1.17
pre-commit:
  piped: true
  commands:
    check:
      run: just check
    leaks:
      run: just leaks
pre-merge-commit:
  commands:
    check:
      run: just check
pre-push:
  commands:
    # Repeats the race suite CI runs; the test cache limits it to changed packages. Drop it if it grows to minutes.
    test:
      use_stdin: true
      run: |
        awk 'NF != 4 || $3 !~ /^refs\/tags\// { other = 1 } END { exit (NR == 0 || other) }' || exec just test
    leaks:
      use_stdin: true
      run: |
        while read -r _ local _ remote; do
          case "$local" in *[!0]*) ;; *) continue ;; esac
          case "$remote" in *[!0]*) range="$remote..$local" ;; *) range="$local --not --remotes" ;; esac
          just leaks "$range" || exit 1
        done
